# ============================================================================
# dsh-ebot-qq —— DSH bundle patch（插件自带的挂载声明）
# ----------------------------------------------------------------------------
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效。
# ⚠️ loader entry 的 id 必须等于命名空间名（settings.update() 只认这个），
#    所以这里的 id 保持 `ebot-qq`，和插件内部命名空间一致。
# ============================================================================

- insert:
    - id: ebot-qq
      name: dsh-ebot-qq
      config:
        # 真正的用户配置在插件的 Config schema 里（设置页可改），这里只放默认值
        enabled: true
